<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 900" role="img" aria-labelledby="title description">
<title id="title">Solstice Windows</title><desc id="description">Schematic of horizontal holes in two upright stones sending light to summer and winter marks on the east face of a central pillar.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#122e35"/><stop offset="1" stop-color="#24474b"/></linearGradient><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10Z" fill="#ffe39b"/></marker></defs>
<rect width="1400" height="900" fill="url(#bg)"/><g font-family="Arial,sans-serif"><text x="90" y="110" fill="#d6e9e7" font-size="20" letter-spacing="5">A THREE-STONE SOLAR CALENDAR</text><text x="86" y="195" fill="#fff3d4" font-family="Georgia,serif" font-size="72">Solstice Windows</text><text x="90" y="245" fill="#d6e9e7" font-size="27">Aim the hole. Light the mark. Compare the seasons.</text>
