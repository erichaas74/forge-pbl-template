<path d="M850 317 1080 355 1080 590 850 551Z" fill="#dfcdac"/><path d="M1080 355 1112 338 1112 573 1080 590Z" fill="#998c74"/><path d="M850 317 882 300 1112 338 1080 355Z" fill="#f0e1c5"/><ellipse cx="965" cy="449" rx="24" ry="28" fill="#102e36" stroke="#ac9671" stroke-width="7"/>
