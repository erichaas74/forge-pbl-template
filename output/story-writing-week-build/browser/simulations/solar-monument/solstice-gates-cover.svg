<text x="1025" y="294" fill="#ffe39b" font-size="25">SUMMER</text><text x="1113" y="544" fill="#bdd9ed" font-size="25">WINTER</text><text x="90" y="828" fill="#d6e9e7" font-size="22">Horizontal bores · 30 minutes after sunrise · Colorado Springs, 2026</text><text x="90" y="864" fill="#9db9b9" font-size="17">Concept diagram. Use the measured blueprint for construction.</text></g></svg>
