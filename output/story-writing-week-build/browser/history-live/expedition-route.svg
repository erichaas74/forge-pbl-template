<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" role="img" aria-labelledby="title desc">
<title id="title">A route toward help</title><desc id="desc">Schematic journey: Weddell Sea to Elephant Island in three boats; then six people in the James Caird to South Georgia. Not to scale.</desc>
<rect width="720" height="400" rx="18" fill="#e8f3f1"/><text x="36" y="48" font-family="sans-serif" font-size="26" fill="#174751" font-weight="bold">A route toward help</text>
<path d="M70 112 V176 H350 V262 H640" fill="none" stroke="#25717a" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><path d="m626 251 18 11-18 11" fill="none" stroke="#25717a" stroke-width="6"/>
<g fill="#174751" font-family="sans-serif" font-size="21"><circle cx="70" cy="112" r="9"/><text x="94" y="120" font-weight="bold">Weddell Sea</text><text x="94" y="148" font-size="17">Ship trapped; camp on ice</text><circle cx="350" cy="176" r="9"/><text x="374" y="183" font-weight="bold">Elephant Island</text><text x="374" y="211" font-size="17">Reached in three small boats</text><circle cx="640" cy="262" r="9"/><text x="380" y="304" font-weight="bold">South Georgia</text><text x="380" y="332" font-size="17">Six people seek help in James Caird</text><text x="36" y="374" font-size="16">Sequence diagram · not to scale · arrows are not compass directions</text></g></svg>
