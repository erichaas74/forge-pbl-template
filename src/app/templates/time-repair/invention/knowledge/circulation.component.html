<svg class="scene" viewBox="0 0 1000 660" role="group" aria-label="Investigate a missing printed debate with manuscripts, presses, and discussion tables">
  <defs>
    <linearGradient id="circulation-wood" x2="0.7" y2="1"><stop stop-color="#384b49"/><stop offset="1" stop-color="#172c30"/></linearGradient>
    <linearGradient id="circulation-paper" x2="1" y2="1"><stop stop-color="#f6e8c8"/><stop offset="1" stop-color="#d4b987"/></linearGradient>
    <radialGradient id="circulation-light"><stop stop-color="#eed2a0" stop-opacity=".17"/><stop offset="1" stop-color="#eed2a0" stop-opacity="0"/></radialGradient>
    <pattern id="circulation-grain" width="90" height="37" patternUnits="userSpaceOnUse"><path d="M0 7Q40 1 90 8M0 28Q50 40 90 27" fill="none" stroke="#e8d7b0" opacity=".045"/></pattern>
    <symbol id="circulation-sheet" viewBox="0 0 44 60">
      <path d="M3 2L39 0 43 56 1 60Z" fill="url(#circulation-paper)" stroke="#8e734b"/>
      <text x="22" y="20" text-anchor="middle" font-size="15" fill="#354942">{{ d().mark }}</text>
      <path d="M8 27H35M9 32H34M8 37H35M9 42H34M8 47H30" stroke="#46554b" stroke-width="1.3"/>
    </symbol>
    <symbol id="circulation-person" viewBox="0 0 40 65">
      <path d="M3 64L7 32Q20 20 33 32L38 64Z" fill="currentColor" stroke="#243935" stroke-width="2"/>
      <path d="M13 21V31L20 39 27 31V21" fill="#c69469"/>
      <ellipse cx="20" cy="16" rx="10" ry="13" fill="#d5ac81"/>
      <path d="M9 15Q7 0 21 1Q34 2 31 17L26 10 10 11Z" fill="#42382f"/>
      <path d="M13 43L24 55M30 40L24 55" fill="none" stroke="#ddbc91" stroke-width="5"/>
    </symbol>
    <symbol id="circulation-press" viewBox="0 0 140 155">
      <path d="M15 145H130L123 153H8Z" fill="#12282b" opacity=".6"/>
      <path d="M25 144V12H116V145M13 145H44M97 145H130" fill="none" stroke="#312d27" stroke-width="18"/>
      <path d="M26 142V13H115V143" fill="none" stroke="#a18151" stroke-width="10"/>
      <path d="M31 22H108M32 31H108M29 130H113" stroke="#d4b37a" stroke-width="3"/>
      <path d="M70 23V80" stroke="#bdb8a1" stroke-width="10"/>
      <path d="M64 32L76 27M64 44L76 39M64 56L76 51M64 68L76 63" stroke="#4e5b50" stroke-width="3"/>
      <path d="M45 79H94V89H45Z" fill="#766c54" stroke="#c9b285" stroke-width="2"/>
      <path d="M13 115L104 106 133 120 40 130Z" fill="#bf9968" stroke="#4d4233" stroke-width="3"/>
      <path d="M30 113L101 110 119 119 45 124Z" fill="#2a3936"/>
      <path d="M70 47L121 36" stroke="#d9bb87" stroke-width="6" stroke-linecap="round"/>
      <circle cx="121" cy="36" r="8" fill="#af7844" stroke="#e9c88b" stroke-width="2"/>
    </symbol>
  </defs>
  <path d="M0 0H1000V660H0Z" fill="url(#circulation-wood)"/>
  <path d="M8 8H992V652H8Z" fill="url(#circulation-grain)" stroke="#7e7d60" stroke-width="3"/>
  <ellipse cx="440" cy="160" rx="660" ry="480" fill="url(#circulation-light)"/>
  <path d="M293 23V636" stroke="#0e2427" stroke-width="7"/>

  <!-- A surviving author and manuscript: the historical idea itself has not vanished. -->
  <g transform="translate(34 31)">
    <path d="M4 4H238V237H4Z" fill="#10282a" opacity=".5"/>
    <path d="M0 0H229V229H0Z" fill="url(#circulation-paper)" stroke="#af8d57" stroke-width="3"/>
    <text x="114" y="27" class="ink-label">{{ d().origin }} · {{ d().date }}</text>
    <path d="M20 164Q29 117 60 111Q97 112 111 164Z" fill="#343b35"/>
    <path d="M49 113L46 127 63 145 82 125 77 110" fill="#d0a278"/>
    <path d="M41 78Q66 52 86 79L82 110Q62 132 45 108Z" fill="#c9a37b" stroke="#705943" stroke-width="2"/>
    <path d="M33 81Q33 56 62 54Q91 53 96 80L86 88 80 74 43 77Z" fill="#333831"/>
    <path d="M38 90Q43 121 59 126M88 90Q82 121 69 127M57 90H52M77 90H72M62 93L60 104 66 105M56 113Q65 117 74 112" fill="none" stroke="#7e674e" stroke-width="2"/>
    <use href="#circulation-sheet" x="126" y="61" width="75" height="103"/>
    <text x="114" y="189" class="ink-label">{{ d().author }}</text>
    <text x="114" y="211" class="caption ink-text">{{ d().document }}</text>
  </g>
  <!-- A copying tool, not a response field. Four visible strokes produce one dispatch copy. -->
  <g transform="translate(48 281)">
    <path d="M0 0H218V63H0Z" fill="#153033" stroke="#a7956b" stroke-width="2"/>
    @for (sheet of sheets; track sheet) {
      @if (n('stock') > sheet) { <use href="#circulation-sheet" [attr.x]="12 + sheet * 28" y="8" width="32" height="43"/> }
    }
    <text x="105" y="88" class="label">Dispatch copies</text>
  </g>
  <g kb label="Write the next portion of a handwritten copy" (activate)="k.act({type:'copy'})" transform="translate(67 381)">
    <path d="M0 8L102 0 112 66 4 77Z" fill="url(#circulation-paper)" stroke="#b59765" stroke-width="2"/>
    @for (row of tables; track row) {
      @if (n('stroke') > row) { <path [attr.d]="'M17 ' + (25 + row*13) + 'L87 ' + (17 + row*13)" stroke="#384e48" stroke-width="3"/> }
    }
    <path d="M73 63Q108 31 153-1Q138 39 92 60L73 63M84 57L147 4" fill="#d9c59a" stroke="#8e794f" stroke-width="2"/>
    <circle cx="149" cy="66" r="17" fill="#243d3b" stroke="#b89a66" stroke-width="4"/>
    <rect class="hit" x="-8" y="-9" width="192" height="108" rx="10" fill="transparent"/>
    <text x="71" y="104" class="small">Hand copy</text>
  </g>
  <!-- The archive selector compares two models; it never changes progress or repairs the past. -->
  <g transform="translate(37 510)">
    <path d="M0 0H226V67H0Z" fill="#142e31" stroke="#aa9367" stroke-width="2"/>
    <g kb label="Inspect the broken timeline" [pressed]="!reference()" (activate)="k.act({type:'compare',value:0})">
      <rect class="hit" x="3" y="3" width="109" height="61" rx="5" [attr.fill]="reference() ? '#1d3839' : '#74533b'"/>
      <text x="56" y="28" class="small">Broken</text><text x="56" y="49" class="small">timeline</text>
    </g>
    <g kb label="Compare the archive with working presses" [pressed]="reference()" (activate)="k.act({type:'compare',value:1})">
      <rect class="hit" x="114" y="3" width="109" height="61" rx="5" [attr.fill]="reference() ? '#536b55' : '#1d3839'"/>
      <text x="169" y="28" class="small">Archive</text><text x="169" y="49" class="small">comparison</text>
    </g>
  </g>
  <g transform="translate(48 603)" [attr.opacity]="inspected() ? 1 : .3">
    <path d="M3 10H205M8 5L3 10 8 15" fill="none" stroke="#dabb85" stroke-width="2"/>
    <text x="104" y="-3" class="small">{{ d().trace }}</text>
    <text x="104" y="32" class="caption">{{ inspected() ? 'Ink trail found' : 'Inspect the ink' }}</text>
  </g>

  <!-- Three carved workshop models. These are comparisons, not a geographical map. -->
  @for (place of d().destinations; track place.id; let i = $index) {
    <g [attr.transform]="'translate(324 ' + (32+i*204) + ')'">
      <path d="M1 0H634V184H1Z" fill="#0c2225" opacity=".38"/>
      <path d="M9 9H625V171H9Z" fill="#3a504c" stroke="#71816a" stroke-width="2"/>
      <path d="M9 132L625 143V172H9Z" fill="#896e49"/>
      <path d="M15 153H620M15 160H619" stroke="#c4a16a" opacity=".4"/>
      <path d="M19 16H244V39H19Z" fill="#e0c698"/>
      <text x="131" y="33" class="ink-label">{{ place.name }}</text>
      <g kb [label]="'Send one manuscript to ' + place.name" (activate)="k.act({type:'send',target:place.id})">
        <path d="M24 60H69V95H24Z M24 60L47 78 69 60" fill="#e4d1a9" stroke="#a18455" stroke-width="2"/>
        <path d="M34 111H68L60 104M68 111L60 118" fill="none" stroke="#e7c98e" stroke-width="3"/>
        <rect class="hit" x="17" y="51" width="59" height="77" rx="5" fill="transparent"/>
        <text x="47" y="153" class="caption">Send</text>
      </g>
      <g kb [label]="'Print a batch in ' + place.name" (activate)="k.act({type:'print',target:place.id})">
        <use href="#circulation-press" x="82" y="40" width="124" height="134"/>
        @if (n('seed-'+place.id)) { <use href="#circulation-sheet" x="111" y="123" width="33" height="25" transform="rotate(-8 127 135)"/> }
        @for (pull of [n('pull-'+place.id)]; track pull) {
          @if (pull) { <path class="pull-mark" d="M195 65L185 92" stroke="#f3d192" stroke-width="5" stroke-linecap="round"/> }
        }
        <rect class="hit" x="80" y="40" width="130" height="134" rx="7" fill="transparent"/>
      </g>
      <g kb [label]="'Inspect ink transfer in ' + place.name" (activate)="k.act({type:'inspect',target:place.id})">
        <path d="M225 57H278V125H225Z" fill="url(#circulation-paper)" stroke="#a98b5f" stroke-width="2"/>
        @if (n('proof-'+place.id)) {
          <use href="#circulation-sheet" x="232" y="61" width="41" height="58" [attr.opacity]="n('proof-'+place.id) === 2 ? 1 : .19"/>
          @if (n('proof-'+place.id) === 1) { <path d="M241 82L245 87M261 95L264 101M243 112L249 109" stroke="#796b4e" stroke-width="2"/> }
        }
        <circle cx="269" cy="127" r="14" fill="#b8d2bb" fill-opacity=".3" stroke="#e4c997" stroke-width="3"/>
        <path d="M279 139L290 150" stroke="#e4c997" stroke-width="5"/>
        <rect class="hit" x="218" y="48" width="82" height="110" rx="6" fill="transparent"/>
      </g>
      @if (n('inspected-'+place.id)) {
        <g transform="translate(305 47)" aria-label="Ink comparison: a clear mark on paper and beading on metal in the broken timeline">
          <path d="M0 0H40V51H0Z" fill="#e6d3ac" stroke="#b39460"/>
          <path d="M8 12L31 40M8 40L31 12" stroke="#2c423c" stroke-width="5"/>
          <path d="M47 0H87V51H47Z" fill="#9eaaa0" stroke="#d3d6b6"/>
          @if (reference()) { <path d="M55 12L78 40M55 40L78 12" stroke="#2c423c" stroke-width="5"/> }
          @else { <circle cx="59" cy="14" r="4" fill="#2c423c"/><circle cx="73" cy="24" r="5" fill="#2c423c"/><circle cx="60" cy="39" r="3" fill="#2c423c"/> }
          <text x="20" y="68" class="caption">Paper</text><text x="69" y="68" class="caption">Metal</text>
        </g>
      } @else {
        <path d="M310 61H391M310 82H391M310 104H391" stroke="#82917a" stroke-width="3" opacity=".4"/>
      }
      <g kb [label]="'Share a copy with a discussion table in ' + place.name" (activate)="k.act({type:'share',target:place.id})">
        <path d="M307 132H397V159H307Z" fill="#233c37" stroke="#b09563" stroke-width="2"/>
        @for (sheet of sheets; track sheet) {
          @if (n('copies-'+place.id) > sheet) { <path [attr.d]="'M'+(314+sheet*12)+' 138h9v16h-9Z'" fill="#ebd7ad" stroke="#bc9d68"/> }
        }
        <path d="M400 146H425L419 140M425 146L419 152" stroke="#ebd7ad" stroke-width="3" fill="none"/>
        <rect class="hit" x="302" y="124" width="125" height="41" rx="5" fill="transparent"/>
      </g>
      @for (table of tables; track table) {
        <g [attr.transform]="'translate('+(438+table*58)+' 72)'" [attr.opacity]="n('readers-'+place.id) > table ? 1 : .22">
          <use href="#circulation-person" x="0" y="0" width="30" height="54" [attr.color]="table === 1 ? '#a47753' : '#8f9b77'"/>
          <use href="#circulation-person" x="23" y="1" width="30" height="54" color="#668b83"/>
          <path d="M0 44H51V53H0ZM6 53V80M44 53V80" fill="#ac8353" stroke="#cfa66c" stroke-width="3"/>
          @if (n('readers-'+place.id) > table) {
            <use href="#circulation-sheet" x="18" y="31" width="20" height="27"/>
            <path class="discussion" d="M9-9Q24-21 38-9M32-16L39-9 30-8" fill="none" stroke="#ebd7ad" stroke-width="2"/>
          }
        </g>
      }
    </g>
  }
</svg>
