<div class="arena">
  <div class="arena-hud">
    <span class="arena-id"><i></i> DELIVERY ARENA</span
    ><span class="target-distance"
      >TARGET <strong>{{ targetDistance() }} cm</strong></span
    >
  </div>
  <svg
    [attr.viewBox]="'-30 -22 ' + (course().widthCm + 52) + ' ' + (course().heightCm + 50)"
    role="img"
    [attr.aria-label]="
      course().name +
      '. Robot at ' +
      pose().xCm.toFixed(1) +
      ', ' +
      pose().yCm.toFixed(1) +
      ' centimeters, heading ' +
      pose().headingDeg.toFixed(0) +
      ' degrees.'
    "
  >
    <defs>
      <linearGradient [attr.id]="artId + '-floor'" x2="0.7" y2="1">
        <stop stop-color="#253f53" />
        <stop offset="1" stop-color="#142635" />
      </linearGradient>
      <linearGradient [attr.id]="artId + '-metal'" x2="0.2" y2="1">
        <stop stop-color="#668298" />
        <stop offset=".25" stop-color="#3f5b72" />
        <stop offset="1" stop-color="#243c50" />
      </linearGradient>
      <linearGradient [attr.id]="artId + '-robot'" x2="1" y2="1">
        <stop stop-color="#66e5cd" />
        <stop offset=".45" stop-color="#169c96" />
        <stop offset="1" stop-color="#095669" />
      </linearGradient>
      <linearGradient [attr.id]="artId + '-armor'" x2="0.5" y2="1">
        <stop stop-color="#ffffff" />
        <stop offset="1" stop-color="#a7c5cd" />
      </linearGradient>
      <linearGradient [attr.id]="artId + '-cargo'" x2=".4" y2="1">
        <stop stop-color="#ffce80" />
        <stop offset=".35" stop-color="#eda950" />
        <stop offset="1" stop-color="#bd6927" />
      </linearGradient>
      <radialGradient [attr.id]="artId + '-spot'">
        <stop stop-color="#33ccb8" stop-opacity=".2" />
        <stop offset="1" stop-color="#33ccb8" stop-opacity="0" />
      </radialGradient>
      <radialGradient [attr.id]="artId + '-dock'">
        <stop stop-color="#ffbf59" stop-opacity=".28" />
        <stop offset="1" stop-color="#ffbf59" stop-opacity="0" />
      </radialGradient>
      <linearGradient [attr.id]="artId + '-beam'" x2="0" y2="1">
        <stop stop-color="#affff0" stop-opacity="0" />
        <stop offset="1" stop-color="#affff0" stop-opacity=".26" />
      </linearGradient>
      <pattern
        [attr.id]="artId + '-tiles'"
        [attr.width]="course().gridSizeCm"
        [attr.height]="course().gridSizeCm"
        patternUnits="userSpaceOnUse"
      >
        <rect
          x=".5"
          y=".5"
          [attr.width]="course().gridSizeCm - 1"
          [attr.height]="course().gridSizeCm - 1"
          rx="1"
          [attr.fill]="paint('floor')"
        />
        <path
          [attr.d]="'M 1 ' + (course().gridSizeCm - 1) + ' V 1 H ' + (course().gridSizeCm - 1)"
          stroke="#7597aa"
          stroke-opacity=".28"
          stroke-width=".5"
          fill="none"
        />
        <circle cx="2.5" cy="2.5" r=".5" fill="#7696a5" opacity=".4" />
      </pattern>
      <pattern
        [attr.id]="artId + '-hazard'"
        width="8"
        height="8"
        patternUnits="userSpaceOnUse"
        patternTransform="rotate(45)"
      >
        <rect width="8" height="8" fill="#f8b752" />
        <rect width="4" height="8" fill="#283945" />
      </pattern>
      <filter
        [attr.id]="artId + '-glow'"
        filterUnits="userSpaceOnUse"
        x="-50"
        y="-50"
        [attr.width]="course().widthCm + 100"
        [attr.height]="course().heightCm + 100"
      >
        <feGaussianBlur stdDeviation="1.5" />
        <feMerge>
          <feMergeNode />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
      <filter [attr.id]="artId + '-shadow'" x="-50%" y="-50%" width="200%" height="220%">
        <feDropShadow dx="1.5" dy="3" stdDeviation="2" flood-color="#030d17" flood-opacity=".7" />
      </filter>
      <symbol [attr.id]="artId + '-crate'" viewBox="-9 -10 18 20">
        <path d="M-8-7H8V8L5 10H-6L-9 7Z" fill="#8f501e" />
        <rect
          x="-8"
          y="-9"
          width="16"
          height="16"
          rx="2"
          [attr.fill]="paint('cargo')"
          stroke="#ffe0a1"
          stroke-width=".5"
        />
        <path d="M-3-9V7M3-9V7" stroke="#724e2f" stroke-width="1.5" opacity=".6" />
        <path d="M-7-7H7" stroke="#ffdfa2" stroke-width=".7" />
        <rect x="-2.5" y="-4" width="5" height="4" rx=".4" fill="#ffe9ba" />
      </symbol>
    </defs>

    <rect
      x="-5"
      y="-5"
      [attr.width]="course().widthCm + 10"
      [attr.height]="course().heightCm + 12"
      rx="7"
      fill="#081624"
      stroke="#4d6b7e"
      stroke-width="1.2"
    />
    <rect
      x="0"
      y="0"
      [attr.width]="course().widthCm"
      [attr.height]="course().heightCm"
      rx="2"
      [attr.fill]="paint('tiles')"
      stroke="#477789"
      stroke-width=".8"
    />
    <ellipse
      [attr.cx]="course().widthCm * 0.5"
      [attr.cy]="course().heightCm * 0.35"
      [attr.rx]="course().widthCm * 0.65"
      [attr.ry]="course().heightCm * 0.6"
      [attr.fill]="paint('spot')"
      pointer-events="none"
    />
    @for (x of xTicks(); track x) {
      <text [attr.x]="x" [attr.y]="course().heightCm + 19" text-anchor="middle" class="ruler">
        {{ x }}
      </text>
      <path
        [attr.d]="'M ' + x + ' ' + (course().heightCm + 5) + ' v 4'"
        stroke="#7192a5"
        stroke-width=".7"
      />
    }
    @for (y of yTicks(); track y) {
      <text x="-11" [attr.y]="flip(y) + 2.5" text-anchor="end" class="ruler">{{ y }}</text>
    }
    <text [attr.x]="course().widthCm" y="-12" text-anchor="end" class="north">
      N ↑ · CENTIMETERS
    </text>
    <path
      [attr.d]="
        'M 3 18 V 3 H 18 M ' +
        (course().widthCm - 18) +
        ' 3 H ' +
        (course().widthCm - 3) +
        ' V 18 M 3 ' +
        (course().heightCm - 18) +
        ' V ' +
        (course().heightCm - 3) +
        ' H 18 M ' +
        (course().widthCm - 18) +
        ' ' +
        (course().heightCm - 3) +
        ' H ' +
        (course().widthCm - 3) +
        ' V ' +
        (course().heightCm - 18)
      "
      stroke="#66e5d6"
      stroke-width="2"
      fill="none"
      opacity=".8"
    />

    @for (zone of course().deliveryZones; track zone.id) {
      <g class="delivery-zone" [class.delivered]="zoneDelivered(zone.id)">
        <rect
          [attr.x]="zone.xCm"
          [attr.y]="flip(zone.yCm + zone.heightCm) + 2"
          [attr.width]="zone.widthCm"
          [attr.height]="zone.heightCm"
          rx="3"
          fill="#091a22"
        />
        <rect
          [attr.x]="zone.xCm"
          [attr.y]="flip(zone.yCm + zone.heightCm)"
          [attr.width]="zone.widthCm"
          [attr.height]="zone.heightCm"
          rx="3"
          fill="#183e3d"
          stroke="#62e6b0"
          stroke-width="1.4"
          [attr.filter]="paint('glow')"
        />
        <rect
          [attr.x]="zone.xCm + 3"
          [attr.y]="flip(zone.yCm + zone.heightCm) + 3"
          [attr.width]="zone.widthCm - 6"
          [attr.height]="zone.heightCm - 6"
          rx="1"
          fill="none"
          stroke="#80e9bb"
          stroke-opacity=".45"
          stroke-dasharray="2 2"
        />
        <text
          [attr.x]="zone.xCm + zone.widthCm / 2"
          [attr.y]="flip(zone.yCm + zone.heightCm / 2) + 3"
          text-anchor="middle"
          class="zone-letter"
        >
          {{ zoneDelivered(zone.id) ? '✓' : zone.label }}
        </text>
        <text
          [attr.x]="zone.xCm + zone.widthCm / 2"
          [attr.y]="flip(zone.yCm + zone.heightCm) - 7"
          text-anchor="middle"
          class="zone-label"
        >
          {{ zone.label }} · {{ zoneDelivered(zone.id) ? 'DELIVERED' : 'DELIVERY' }}
        </text>
      </g>
    }
    @for (point of course().checkpoints; track point.id) {
      <g [attr.transform]="'translate(' + point.xCm + ' ' + flip(point.yCm) + ')'">
        <circle
          [attr.r]="point.radiusCm + 3"
          fill="#312e31"
          stroke="#ddb066"
          stroke-dasharray="2 2"
        />
        <path d="M -3 0 H 3 M 0 -3 V 3" stroke="#ffd681" />
      </g>
    }

    <circle
      [attr.cx]="course().startPose.xCm"
      [attr.cy]="flip(course().startPose.yCm)"
      r="12"
      fill="#14343b"
      stroke="#5bacae"
      stroke-dasharray="2 2"
    />
    <text
      [attr.x]="course().startPose.xCm"
      [attr.y]="flip(course().startPose.yCm) + 21"
      text-anchor="middle"
      class="start-label"
    >
      START
    </text>
    <g
      [attr.transform]="'translate(' + target().xCm + ' ' + flip(target().yCm) + ')'"
      class="parking-dock"
    >
      <circle r="27" [attr.fill]="paint('dock')" />
      <circle cy="2" r="15" fill="#151f2a" stroke="#704c29" />
      <circle
        r="15"
        fill="#3d3430"
        stroke="#ffbc55"
        stroke-width="1.6"
        [attr.filter]="paint('glow')"
      />
      <circle r="11.5" fill="none" stroke="#ffdc97" stroke-width=".8" stroke-dasharray="5 3" />
      <path d="M -6 0 H 6 M 0 -6 V 6" stroke="#ffdfaa" stroke-width="1.5" />
      <path
        d="M -19 -6 V -19 H -6 M 6 -19 H 19 V -6 M -19 6 V 19 H -6 M 6 19 H 19 V 6"
        fill="none"
        stroke="#ffc96b"
        stroke-width=".8"
        opacity=".7"
      />
      <text y="-25" text-anchor="middle" class="dock-label">PARK</text>
    </g>
    @if (showTrace()) {
      <polyline
        [attr.points]="trace()"
        fill="none"
        stroke="#39dbc7"
        stroke-width="6"
        stroke-opacity=".14"
        stroke-linejoin="round"
      />
      <polyline
        [attr.points]="trace()"
        fill="none"
        stroke="#70f4df"
        stroke-width="1.5"
        stroke-linejoin="round"
        stroke-linecap="round"
        [attr.filter]="paint('glow')"
      />
    }
    @for (wall of course().obstacles; track wall.id) {
      <g
        class="storage-rack"
        [attr.transform]="'translate(' + wall.xCm + ' ' + flip(wall.yCm + wall.heightCm) + ')'"
      >
        <rect
          x="2"
          y="4"
          [attr.width]="wall.widthCm"
          [attr.height]="wall.heightCm"
          rx="3"
          fill="#030b13"
          opacity=".65"
        />
        <rect
          x="0"
          y="0"
          [attr.width]="wall.widthCm"
          [attr.height]="wall.heightCm"
          rx="2"
          [attr.fill]="paint('metal')"
          stroke="#7d98a9"
          stroke-width=".8"
        />
        <rect
          x="0"
          [attr.y]="wall.heightCm - 5"
          [attr.width]="wall.widthCm"
          height="5"
          [attr.fill]="paint('hazard')"
        />
        <path
          [attr.d]="
            'M 3 ' +
            (wall.heightCm - 6) +
            ' V 3 H ' +
            (wall.widthCm - 3) +
            ' V ' +
            (wall.heightCm - 6)
          "
          stroke="#9db3bd"
          stroke-width="2"
          fill="none"
        />
        @for (crate of rackCrates(wall.widthCm, wall.heightCm); track $index) {
          <use
            [attr.href]="'#' + artId + '-crate'"
            [attr.x]="crate.x"
            [attr.y]="crate.y"
            width="16"
            height="18"
          />
        }
        <rect
          x="4"
          [attr.y]="wall.heightCm - 17"
          [attr.width]="wall.widthCm - 8"
          height="10"
          rx="1"
          fill="#122839"
        />
        <text
          [attr.x]="wall.widthCm / 2"
          [attr.y]="wall.heightCm - 10"
          text-anchor="middle"
          class="rack-label"
        >
          {{ wall.label }}
        </text>
        <circle cx="3" cy="3" r="1" fill="#d8e6e9" />
        <circle [attr.cx]="wall.widthCm - 3" cy="3" r="1" fill="#d8e6e9" />
      </g>
    }
    @for (pkg of course().packages; track pkg.id) {
      @if (
        !sample()?.carryingPackageIds?.includes(pkg.id) &&
        !sample()?.deliveredPackageIds?.includes(pkg.id)
      ) {
        <g [attr.transform]="'translate(' + pkg.xCm + ' ' + flip(pkg.yCm) + ')'">
          <ellipse cy="7" rx="11" ry="6" fill="#030d16" opacity=".7" />
          <use
            [attr.href]="'#' + artId + '-crate'"
            x="-9"
            y="-10"
            width="18"
            height="20"
            [attr.filter]="paint('shadow')"
          />
          <text y="-15" text-anchor="middle" class="package-label">{{ pkg.label }}</text>
        </g>
      }
    }
    <g
      class="rover"
      [attr.transform]="
        'translate(' + pose().xCm + ' ' + flip(pose().yCm) + ') rotate(' + pose().headingDeg + ')'
      "
    >
      <ellipse cy="3" rx="14" ry="14" fill="#06101b" opacity=".65" />
      <ellipse rx="22" ry="24" [attr.fill]="paint('spot')" />
      <path d="M-7-8 L-16-35 H16 L7-8Z" [attr.fill]="paint('beam')" pointer-events="none" />
      <g [attr.filter]="paint('shadow')">
        <rect
          x="-11"
          y="-8"
          width="5"
          height="17"
          rx="2"
          fill="#071722"
          stroke="#527483"
          stroke-width=".5"
        />
        <rect
          x="6"
          y="-8"
          width="5"
          height="17"
          rx="2"
          fill="#071722"
          stroke="#527483"
          stroke-width=".5"
        />
        @for (y of [-5, -2, 1, 4, 7]; track y) {
          <path
            [attr.d]="'M -10 ' + y + ' h 3 M 7 ' + y + ' h 3'"
            stroke="#45606c"
            stroke-width=".8"
          />
        }
        <rect
          x="-8"
          y="-10"
          width="16"
          height="21"
          rx="5"
          [attr.fill]="paint('robot')"
          stroke="#8af5de"
          stroke-width=".6"
        />
        <path d="M-6-7Q-6-10 0-10Q6-10 6-7L5 1H-5Z" [attr.fill]="paint('armor')" />
        <rect
          x="-5.5"
          y="-8"
          width="11"
          height="5.5"
          rx="2.3"
          fill="#0b2535"
          stroke="#72999f"
          stroke-width=".4"
        />
        <rect x="-3.5" y="-6.5" width="2.3" height="2" rx=".5" fill="#79ffdf" />
        <rect x="1.2" y="-6.5" width="2.3" height="2" rx=".5" fill="#79ffdf" />
        <path d="M-5 4H5V8H-5Z" fill="#153944" stroke="#70b9b5" stroke-width=".4" />
        <rect x="-7" y="-9" width="2" height="1.5" rx=".5" fill="#ffe29c" />
        <rect x="5" y="-9" width="2" height="1.5" rx=".5" fill="#ffe29c" />
        <path d="M-6 9H6" stroke="#36e0ba" stroke-width="1.2" />
        @if (sample()?.carryingPackageIds?.length) {
          <use [attr.href]="'#' + artId + '-crate'" x="-5" y="1" width="10" height="11" />
        }
      </g>
    </g>
  </svg>
  <div class="arena-bottom">
    <span><i class="robot-dot"></i>ROVER ONLINE</span
    ><span
      >{{ sample()?.deliveredPackageIds?.length ?? 0 }} /
      {{ course().packages.length }} DELIVERIES</span
    >
  </div>
</div>
<div class="legend">
  <span><i class="robot"></i>Robot</span><span><i class="target"></i>Parking target</span
  ><span><i class="trace"></i>Travelled path</span
  ><span>Each square = {{ course().gridSizeCm }} cm</span>
</div>
